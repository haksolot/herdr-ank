[package]
name = "herdr-ank"
version = "0.2.2"
edition = "2021"
description = "herdr plugin integrating the ank task and decision corpus"
default-run = "herdr-ank"

# A stand-in for herdr and ank in the integration tests (tests/support).
[[bin]]
name = "fake-cli"
path = "tests/support/fake_cli.rs"
test = false

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3.27.0"
