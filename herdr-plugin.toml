id = "ank"
name = "Ank"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Ank tasks, claims and decisions in herdr"
platforms = ["linux", "macos", "windows"]

# One [[build]] per platform family (ADR-599b6f424271). The entries below name
# ./bin/herdr-ank on every platform: on Windows herdr resolves it to
# herdr-ank.exe, through std's Command for actions, startup and events and
# through PATHEXT for panes.
[[build]]
command = ["sh", "install.sh"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "install.ps1"]
platforms = ["windows"]

[[actions]]
id = "work"
title = "Work a task"
contexts = ["workspace"]
command = ["./bin/herdr-ank", "work"]

[[panes]]
id = "pick"
title = "Pick a task"
placement = "popup"
command = ["./bin/herdr-ank", "pick"]

[[panes]]
id = "tui"
title = "Ank"
placement = "overlay"
command = ["./bin/herdr-ank", "tui"]

[[startup]]
command = ["./bin/herdr-ank", "daemon"]

# The [[events]] below are the daemon's supervisor (ADR-6fb76f3a1197): each
# launches `herdr-ank daemon`, which exits 0 at once while one already runs.
[[events]]
on = "workspace.created"
command = ["./bin/herdr-ank", "daemon"]

[[events]]
on = "tab.created"
command = ["./bin/herdr-ank", "daemon"]

[[events]]
on = "pane.agent_detected"
command = ["./bin/herdr-ank", "daemon"]

[[events]]
on = "worktree.opened"
command = ["./bin/herdr-ank", "daemon"]
