id = "ank"
name = "Ank"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Ank tasks, claims and decisions in herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "work"
title = "Work a task"
contexts = ["workspace"]
command = ["./target/release/herdr-ank", "work"]

[[panes]]
id = "pick"
title = "Pick a task"
placement = "popup"
command = ["./target/release/herdr-ank", "pick"]

[[panes]]
id = "tui"
title = "Ank"
placement = "overlay"
command = ["./target/release/herdr-ank", "tui"]
