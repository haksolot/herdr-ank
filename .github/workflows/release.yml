# Publishes the prebuilt binaries install.sh and install.ps1 download (ADR-599b6f424271).
# Triggered only by a tag the human pushes; nothing here creates a tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          want="${TAG#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -n 1)
          if [ "$want" != "$cargo" ] || [ "$want" != "$manifest" ]; then
            echo "::error::tag $TAG does not match Cargo.toml ($cargo) and herdr-plugin.toml ($manifest)"
            exit 1
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          cargo +stable build --release --locked --target "$TARGET"
      - if: runner.os != 'Windows'
        run: tar -czf "herdr-ank-${VERSION}-${TARGET}.tar.gz" -C "target/${TARGET}/release" herdr-ank
      # install.ps1 unpacks with Expand-Archive, so the Windows archive is a zip
      # holding herdr-ank.exe at its root.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -LiteralPath "target/$env:TARGET/release/herdr-ank.exe"
          -DestinationPath "herdr-ank-$env:VERSION-$env:TARGET.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: herdr-ank-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: |
          set -eu
          set -- *.tar.gz *.zip
          test "$#" -eq 5
          sha256sum -- "$@" > SHA256SUMS
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v${VERSION}" -- "$@" SHA256SUMS
